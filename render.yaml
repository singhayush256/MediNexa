# =============================================================================
# MEDINEXA PLATFORM — RENDER STAGING BLUEPRINT MANIFEST
# =============================================================================
# Render Blueprint configuration for automated staging web service deployment.
# Secrets (DATABASE_URL, JWT_SECRET) must be set in the Render Dashboard.

services:
  - type: web
    name: medinexa-staging-api
    env: node
    region: ohio
    plan: free
    buildCommand: npm install && npm run build --workspace=packages/types && npm run build --workspace=packages/validation && npx prisma generate --schema=./database/prisma/schema.prisma && npm run build:api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: AI_PROVIDER
        value: MOCK
